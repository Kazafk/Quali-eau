<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quali'eau — Qualité de l'eau du robinet en France</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1>💧 Quali'eau</h1>
      <a id="lien-methodologie" href="methodologie.html">ℹ️ Méthodologie</a>
      <div id="recherche">
        <input id="recherche-input" type="text" placeholder="Rechercher une commune…" autocomplete="off">
        <button id="btn-geoloc" type="button" aria-label="Me géolocaliser">📍</button>
        <ul id="recherche-suggestions" hidden></ul>
        <p id="recherche-erreur" hidden></p>
      </div>
      <div id="toggle-indicateur">
        <button id="btn-boisson" class="toggle-btn active" type="button">🥤 Boisson &amp; Santé</button>
        <button id="btn-cosmetique" class="toggle-btn" type="button">🧴 Cosmétique &amp; Lavage</button>
      </div>
    </header>
    <main>
      <div id="map-container">
        <div id="map"></div>
        <div id="map-error" hidden>Impossible de charger la carte. Réessayez plus tard.</div>
        <div id="legend"></div>
      </div>
      <aside id="panel" hidden>
        <button id="panel-close" type="button" aria-label="Fermer la fiche">✕</button>
        <div id="panel-content"></div>
      </aside>
    </main>
  </div>
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script type="module" src="map.js"></script>
</body>
</html>
